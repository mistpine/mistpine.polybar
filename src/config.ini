; The bar in the screenshots. scripts/generate.ts writes it to
; examples/config.ini; colors only as ${colors.*} references, which
; mistpine.ini defines.

[bar/mistpine]
; MONITOR=DP-2 polybar mistpine, one per monitor; unset, the whole screen.
monitor = ${env:MONITOR:}
width = 100%
height = 20pt
background = ${colors.background}
foreground = ${colors.foreground}
; The focused workspace's underline.
line-size = 2pt

font-0 = monospace:size=11;2
font-1 = monospace:weight=bold:size=11;2

padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.bg4}

modules-left = cpu memory filesystem
modules-center = i3
modules-right = network pulseaudio date tray

enable-ipc = true

; Labels in yellow and bold, values in bright purple (purple is 4.49:1 on
; the bar).
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.yellow}
format-prefix-font = 2
label = %percentage%%
label-foreground = ${colors.bright-purple}

[module/memory]
type = internal/memory
interval = 5
format-prefix = "RAM "
format-prefix-foreground = ${colors.yellow}
format-prefix-font = 2
label = %gb_used% (%percentage_used%%)
label-foreground = ${colors.bright-purple}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
format-mounted-prefix = "/ "
format-mounted-prefix-foreground = ${colors.yellow}
format-mounted-prefix-font = 2
label-mounted = %percentage_used%%
label-mounted-foreground = ${colors.bright-purple}
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

; Workspaces like the windows in mistpine.sway: the focused one raised with
; an accent underline, urgent ones filled red, a binding mode in yellow.
[module/i3]
type = internal/i3
pin-workspaces = true
format = <label-state> <label-mode>
label-focused = %index%
label-focused-background = ${colors.bg3}
label-focused-foreground = ${colors.fg3}
label-focused-underline = ${colors.blue}
label-focused-padding = 2
label-visible = %index%
label-visible-foreground = ${colors.fg2}
label-visible-underline = ${colors.bg4}
label-visible-padding = 2
label-unfocused = %index%
label-unfocused-foreground = ${colors.fg1}
label-unfocused-padding = 2
label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.bg0}
label-urgent-padding = 2
label-mode = %mode%
label-mode-background = ${colors.yellow}
label-mode-foreground = ${colors.bg0}
label-mode-padding = 2

[module/network]
type = internal/network
interface-type = wireless
interval = 5
format-connected-prefix = "NET "
format-connected-prefix-foreground = ${colors.yellow}
format-connected-prefix-font = 2
label-connected = %local_ip%
label-connected-foreground = ${colors.bright-purple}
label-disconnected = offline
label-disconnected-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.yellow}
format-volume-prefix-font = 2
label-volume = %percentage%%
label-volume-foreground = ${colors.bright-purple}
label-muted = VOL muted
label-muted-foreground = ${colors.disabled}

[module/date]
type = internal/date
interval = 30
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.bright-purple}

[module/tray]
type = internal/tray
tray-spacing = 8pt
