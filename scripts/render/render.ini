; The README bar: the example's bar/mistpine at 288 dpi in JetBrains Mono,
; with fixed values for the modules that need hardware or change by the
; minute. Colors only through the example's own ${colors.*}.
include-file = config.ini

[bar/render]
inherit = bar/mistpine
dpi = 288
font-0 = JetBrains Mono:size=11;2
font-1 = JetBrains Mono:style=Bold:size=11;2
modules-right = net vol day

[module/net]
type = custom/text
format-prefix = "NET "
format-prefix-foreground = ${colors.yellow}
format-prefix-font = 2
label = 192.168.1.20
label-foreground = ${colors.bright-purple}

[module/vol]
type = custom/text
format-prefix = "VOL "
format-prefix-foreground = ${colors.yellow}
format-prefix-font = 2
label = 62%
label-foreground = ${colors.bright-purple}

[module/day]
type = custom/text
label = Sat 14 Nov  21:30
label-foreground = ${colors.bright-purple}
